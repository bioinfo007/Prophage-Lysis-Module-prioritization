[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers

markers =
    slow: marks test as slow (> 30s) — skip with: pytest -m "not slow"
    gpu:  marks test as requiring a CUDA GPU — skip with: pytest -m "not gpu"
    integration: marks as integration test requiring full pipeline state

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:numba
    ignore::FutureWarning:sklearn
    ignore::RuntimeWarning:numpy
