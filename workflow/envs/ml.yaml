name: prophage_ml
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0

  # Clustering and dimensionality reduction
  - umap-learn>=0.5.3
  - hdbscan>=0.8.33
  - scikit-learn>=1.3

  # Bioinformatics
  - biopython>=1.81
  - networkx>=3.1

  # JIT compilation and GPU support
  - numba>=0.57

  # Visualization
  - matplotlib>=3.7

  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.65
  - requests>=2.28
  - typer>=0.9

  - pip:
    # ESM-2 protein language model — install via pip (not on conda)
    - fair-esm>=2.0.0
    # PyTorch — install CPU version by default; override with CUDA build if GPU available
    - torch>=2.0.0
